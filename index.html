<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Implantations PCP France</title>
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="loading-screen">Vérification de l'accès...</div>

<div id="page" style="display:none;">
  <div id="site-header">
    <img class="header-logo" src="logo-pcp.png" alt="Pest Control Partnership" />
<div class="header-text">
  <h1>Implantations PCP France</h1>
  <p>Carte des agences &amp; entités du groupe</p>
</div>
    <span class="badge-mode">Consultation</span>
    <div class="header-user-bar">
      <a href="prospection.html">🎯 Prospection</a>
      <a href="admin.html" data-role-admin style="display:none;">⚙ Administration</a>
      <span data-current-user-email></span>
      <button data-logout-btn>Déconnexion</button>
    </div>
  </div>
  <div id="app">
    <div id="panel">
      <div id="search-add">
        <input id="search-input" type="text" placeholder="Rechercher une entité..." />
      </div>
      <div id="filter-bar">
        <div class="filter-label">
          <span>Filtrer par activité</span>
          <button id="clear-filters">Effacer</button>
        </div>
        <div id="chips"></div>
      </div>
      <div id="count-bar">
        <span id="count-text">— entités</span>
        <span></span>
      </div>
      <div id="list"></div>
    </div>
    <div id="panel-backdrop"></div>
    <div id="map"></div>
  </div>
</div>
<button id="panel-toggle" class="mobile-toggle-btn">🗺️ Voir la liste</button>
<div id="toast"></div>

<div id="modal-overlay">
  <div id="modal-box">
    <h2 id="modal-title">Activités</h2>
    <p class="modal-sub">Activités de cette entité.</p>
    <div id="modal-options"></div>
    <button id="modal-close">Fermer</button>
  </div>
</div>

<script>window.APP_MODE = 'public';</script>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
<script>
(async function(){
  const auth = await AUTH_GUARD.init(null);
  if(!auth) return;
  document.getElementById('page').style.display = 'flex';
  document.getElementById('loading-screen').style.display = 'none';
  window.PCP_APP.boot();
})();
</script>
</body>
</html>
