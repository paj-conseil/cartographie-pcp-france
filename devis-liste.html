<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Historique des devis — PCP France</title>
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="devis.css" />
<link rel="stylesheet" href="devis-liste.css" />
</head>
<body>

<div id="loading-screen">Vérification de l'accès...</div>

<div id="devis-liste-page" style="display:none;">
  <div id="site-header">
    <img class="header-logo" src="logo-pcp.png" alt="Pest Control Partnership" />
    <div class="header-text">
      <h1>Historique des devis</h1>
      <p>Suivi des propositions par entreprise</p>
    </div>
    <span class="badge-mode">CRM</span>
    <div class="header-user-bar">
      <a href="admin.html" data-role-admin style="display:none;">⚙ Administration</a>
      <span data-current-user-email></span>
      <button data-logout-btn>Déconnexion</button>
    </div>
  </div>

  <div id="priorites-toolbar">
    <a href="devis.html">+ Nouveau devis</a>
  </div>

  <div id="dl-toolbar">
    <input id="dl-search" type="text" placeholder="Rechercher un client, un numéro de devis..." />
    <select id="dl-status-filter">
      <option value="">Tous les statuts</option>
      <option value="brouillon">Brouillon</option>
      <option value="envoye">Envoyé</option>
      <option value="accepte">Accepté</option>
      <option value="refuse">Refusé</option>
    </select>
  </div>

  <div id="dl-table-wrap">
    <table id="dl-table">
      <thead>
        <tr>
          <th>N°<span class="sort-arrows"><button type="button" class="sort-arrow" data-key="numero" data-dir="asc" title="Trier croissant">▲</button><button type="button" class="sort-arrow" data-key="numero" data-dir="desc" title="Trier décroissant">▼</button></span></th>
          <th>Client<span class="sort-arrows"><button type="button" class="sort-arrow" data-key="client" data-dir="asc" title="Trier croissant">▲</button><button type="button" class="sort-arrow" data-key="client" data-dir="desc" title="Trier décroissant">▼</button></span></th>
          <th>Entité<span class="sort-arrows"><button type="button" class="sort-arrow" data-key="agence" data-dir="asc" title="Trier croissant">▲</button><button type="button" class="sort-arrow" data-key="agence" data-dir="desc" title="Trier décroissant">▼</button></span></th>
          <th>Date<span class="sort-arrows"><button type="button" class="sort-arrow" data-key="date" data-dir="asc" title="Trier croissant">▲</button><button type="button" class="sort-arrow" data-key="date" data-dir="desc" title="Trier décroissant">▼</button></span></th>
          <th>Montant TTC<span class="sort-arrows"><button type="button" class="sort-arrow" data-key="montant" data-dir="asc" title="Trier croissant">▲</button><button type="button" class="sort-arrow" data-key="montant" data-dir="desc" title="Trier décroissant">▼</button></span></th>
          <th>Statut<span class="sort-arrows"><button type="button" class="sort-arrow" data-key="statut" data-dir="asc" title="Trier croissant">▲</button><button type="button" class="sort-arrow" data-key="statut" data-dir="desc" title="Trier décroissant">▼</button></span></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="dl-tbody"></tbody>
    </table>
    <div id="dl-empty" style="display:none;">Aucun devis pour le moment.</div>
  </div>
</div>

<div id="toast"></div>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<script src="entity-scope.js"></script>
<script src="site-nav.js"></script>
<script src="devis-liste.js"></script>
<script>
(async function(){
  const auth = await AUTH_GUARD.init(null);
  if(!auth) return;
  document.getElementById('devis-liste-page').style.display = 'block';
  document.getElementById('loading-screen').style.display = 'none';
  window.DEVIS_LISTE_APP.boot(auth.sb, auth.user);
})();
</script>
</body>
</html>
