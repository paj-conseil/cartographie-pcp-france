<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Priorités — Administration PCP France</title>
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="priorites.css" />
</head>
<body>

<div id="loading-screen">Vérification de l'accès...</div>

<div id="priorites-page" style="display:none;">
  <div id="site-header">
    <img class="header-logo" src="logo-pcp.png" alt="Pest Control Partnership" />
<div class="header-text">
  <h1>Priorités de prospection</h1>
  <p>Croisement activités PCP × cibles clients</p>
</div>
    <span class="badge-mode">Administration</span>
  </div>

  <div id="priorites-toolbar">
    <a href="admin.html">← Administration</a>
    <a href="prospection.html">Voir la prospection →</a>
    <button data-logout-btn>Déconnexion</button>
  </div>

  <div id="priorites-legend">
    <span><i class="dot dot-1"></i> Priorité 1</span>
    <span><i class="dot dot-2"></i> Priorité 2</span>
    <span><i class="dot dot-3"></i> Priorité 3</span>
    <span><i class="dot dot-0"></i> Non défini</span>
    <span id="save-status" class="save-status">enregistré</span>
  </div>

  <div id="table-wrap">
    <table id="priorites-table"></table>
  </div>
</div>

<div id="toast"></div>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<script src="site-nav.js"></script>
<script src="priorites.js"></script>
<script>
(async function(){
  const auth = await AUTH_GUARD.init('admin');
  if(!auth) return;
  document.getElementById('priorites-page').style.display = 'block';
  document.getElementById('loading-screen').style.display = 'none';
  window.PRIORITES_APP.boot(auth.sb);
})();
</script>
</body>
</html>
