<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prospection PCP France</title>
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="prospection.css" />
</head>
<body>

<div id="loading-screen">Vérification de l'accès...</div>

<div id="page" style="display:none;">
  <div id="site-header">
    <img class="header-logo" src="logo-pcp.png" alt="Pest Control Partnership" />
<div class="header-text">
  <h1>Prospection PCP France</h1>
  <p>Identification de cibles commerciales par ville ou département</p>
</div>
    <a href="index.html" class="badge-mode" style="text-decoration:none;">← Cartographie</a>
    <div class="header-user-bar">
      <a href="admin.html" data-role-admin style="display:none;">⚙ Administration</a>
      <span data-current-user-email></span>
      <button data-logout-btn>Déconnexion</button>
    </div>
  </div>

  <div id="app">
    <div id="panel" class="prospection-panel">

      <div class="prosp-section">
        <div class="prosp-section-title">1. Zone de recherche</div>
        <div class="mode-toggle">
          <label><input type="radio" name="mode" value="ville" checked /> Ville + rayon</label>
          <label><input type="radio" name="mode" value="departement" /> Département</label>
          <label><input type="radio" name="mode" value="france" /> Toute la France</label>
        </div>
        <div id="mode-hint" class="mode-hint"></div>
        <div id="mode-ville-fields">
          <input id="ville-input" type="text" placeholder="Ex : Lyon, Bordeaux, Rennes..." />
          <div class="radius-row">
            <input id="radius-input" type="range" min="5" max="50" value="50" step="5" />
            <span id="radius-value">50 km</span>
          </div>
        </div>
        <div id="mode-dept-fields" style="display:none;">
          <select id="departement-select"></select>
        </div>
      </div>

      <div class="prosp-section">
        <div class="prosp-section-title">2. Activité</div>
        <select id="activity-select">
          <option value="">— Sélectionner une activité —</option>
        </select>
      </div>

      <div class="prosp-section">
        <div class="prosp-section-title">3. Cible clients
          <span class="select-all-controls">
            <button id="select-all-btn" type="button">Tout cocher</button> · <button id="select-none-btn" type="button">Tout décocher</button>
          </span>
        </div>
        <div id="groupes-list" class="groupes-list"></div>
      </div>

      <div class="prosp-run-wrap">
        <button id="run-search" class="prosp-run-btn">🔍 Lancer la recherche</button>
        <div id="search-status" class="search-status"></div>
      </div>

      <div id="count-bar">
        <div class="count-bar-top">
          <span id="count-text">— cibles</span>
          <span class="select-all-controls">
            <button id="results-select-all-btn" type="button">Tout sélectionner</button> · <button id="results-select-none-btn" type="button">Tout désélectionner</button>
          </span>
        </div>
        <div class="count-bar-actions">
          <button id="table-view-btn" type="button" disabled title="Vue tableau condensée">▤ Tableau</button>
          <a id="my-lists-link" href="prospection-listes.html" target="_blank" title="Mes listes de prospection">📁 Mes listes</a>
          <button id="export-xlsx" disabled data-hide-lecteur>Exporter Excel</button>
        </div>
      </div>

      <div id="selection-bar" class="selection-bar" style="display:none;">
        <span id="selection-count"></span>
        <div class="selection-actions">
          <button id="add-to-list-btn" type="button">+ Ajouter à une liste</button>
          <button id="clear-selection-btn" type="button">Désélectionner</button>
        </div>
      </div>

      <div id="results-list" class="results-list"></div>
    </div>

    <div id="panel-backdrop"></div>
    <div id="prospection-map"></div>
    <button id="show-all-btn" class="show-all-btn" style="display:none;">✕ Voir tous les résultats</button>
  </div>
</div>
<button id="panel-toggle" class="mobile-toggle-btn">🔍 Voir les filtres</button>

<div id="toast"></div>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<script src="site-nav.js"></script>
<script src="prospection-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="prospection-lists.js"></script>
<script src="prospection.js"></script>
<script>
(async function(){
  const auth = await AUTH_GUARD.init(null);
  if(!auth) return;
  document.getElementById('page').style.display = 'flex';
  document.getElementById('loading-screen').style.display = 'none';
  window.PROSPECTION_APP.boot();
})();
</script>
</body>
</html>
