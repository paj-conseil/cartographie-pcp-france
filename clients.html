<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clients — PCP France</title>
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="crm-liste.css" />
</head>
<body>

<div id="loading-screen">Vérification de l'accès...</div>

<div id="crm-clients-page" class="crm-page" style="display:none;">
  <div id="site-header">
    <img class="header-logo" src="logo-pcp.png" alt="Pest Control Partnership" />
    <div class="header-text">
      <h1>Clients</h1>
      <p>Entreprises ayant accepté au moins un devis</p>
    </div>
    <span class="badge-mode">CRM</span>
    <div class="header-user-bar">
      <a href="admin.html" data-role-admin style="display:none;">⚙ Administration</a>
      <span data-current-user-email></span>
      <button data-logout-btn>Déconnexion</button>
    </div>
  </div>

  <div class="crm-toolbar">
    <input id="cl-search" type="text" placeholder="Rechercher un client, un contact, une commune..." />
  </div>

  <div class="crm-table-wrap">
    <table class="crm-table">
      <thead>
        <tr>
          <th>Client</th><th>Adresse</th><th>Contact</th><th>Devis acceptés</th><th>Montant total TTC</th><th>Dernier devis accepté</th><th></th>
        </tr>
      </thead>
      <tbody id="cl-tbody"></tbody>
    </table>
    <div id="cl-empty" class="crm-empty" style="display:none;">Aucun client pour le moment — un client apparaît ici dès qu'un de ses devis passe au statut « Accepté ».</div>
  </div>
</div>

<div id="toast"></div>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<script src="entity-scope.js"></script>
<script src="site-nav.js"></script>
<script src="clients.js"></script>
<script>
(async function(){
  const auth = await AUTH_GUARD.init(null);
  if(!auth) return;
  document.getElementById('crm-clients-page').style.display = 'block';
  document.getElementById('loading-screen').style.display = 'none';
  window.CLIENTS_APP.boot(auth.sb, auth.user);
})();
</script>
</body>
</html>
